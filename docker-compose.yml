name: finora

x-mongo-healthcheck: &mongo-healthcheck
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  interval: 5s
  timeout: 5s
  retries: 10

# mongod's default verbosity logs a connection-accepted/client-metadata/
# access-control/ended line quartet for every single client connection —
# including the 5s healthcheck above, which opens fresh mongosh connections
# every interval, across all 4 Mongo containers. Two things were tried and
# ruled out before landing on this:
#   1. --quiet alone (Mongo 7) only suppresses the "Connection accepted"/
#      "Connection ended" pair; "client metadata"/"Received first command"
#      (NETWORK) and "Connection not authenticating" (ACCESS) still print.
#   2. Dropping component verbosity to -1 via --setParameter
#      logComponentVerbosity — confirmed via `db.adminCommand({getParameter:
#      1, logComponentVerbosity: 1})` that this was genuinely applied, but
#      it had zero effect on these lines: component verbosity only gates
#      Debug-level (D1-D5) messages, never Informational ("I") severity,
#      which is what connection-lifecycle logging uses. There is no
#      supported mongod flag to selectively hide Informational messages.
# The actual fix: redirect mongod's own log output to a file inside the
# already-persistent /data/db volume instead of stdout, so `docker compose
# logs` (which only ever sees a container's stdout/stderr) shows nothing
# from routine Mongo operation. This is a real trade-off, not a free lunch:
# if mongod ever fails outright, `docker compose logs` won't show why —
# inspect the file directly instead, e.g.
# `docker compose exec mongo-user cat /data/db/mongod.log`. Writing under
# /data/db (not a separate path) means the log survives container
# recreation as long as the named volume does, which is a bonus for
# post-mortem debugging, not just a location of convenience.
x-mongo-command: &mongo-command
  - mongod
  - --quiet
  - --logpath
  - /data/db/mongod.log
  - --logappend

x-go-service-env: &go-service-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  # ---------------------------------------------------------------- MongoDB
  mongo-user:
    image: mongo:7
    restart: unless-stopped
    command: *mongo-command
    volumes: ["mongo-user-data:/data/db"]
    healthcheck: *mongo-healthcheck
    # Host-side port so MongoDB Compass (or any client on the host, outside
    # the docker network) can connect directly — services inside the
    # network still reach this container by name (mongo-user:27017)
    # regardless of this mapping, per USER_SERVICE_MONGO_URI above.
    ports: ["${MONGO_USER_PORT:-27017}:27017"]

  mongo-expense:
    image: mongo:7
    restart: unless-stopped
    command: *mongo-command
    volumes: ["mongo-expense-data:/data/db"]
    healthcheck: *mongo-healthcheck
    ports: ["${MONGO_EXPENSE_PORT:-27018}:27017"]

  mongo-budget:
    image: mongo:7
    restart: unless-stopped
    command: *mongo-command
    volumes: ["mongo-budget-data:/data/db"]
    healthcheck: *mongo-healthcheck
    ports: ["${MONGO_BUDGET_PORT:-27019}:27017"]

  mongo-notification:
    image: mongo:7
    restart: unless-stopped
    command: *mongo-command
    volumes: ["mongo-notification-data:/data/db"]
    healthcheck: *mongo-healthcheck
    ports: ["${MONGO_NOTIFICATION_PORT:-27020}:27017"]

  # -------------------------------------------------------------------- NATS
  # Phase 7's event bus (JetStream, for at-least-once delivery + persistence
  # — see shared/eventbus's doc comment for why core NATS pub/sub alone
  # isn't enough). One shared instance for the whole fleet, same "one
  # instance of shared infrastructure, not one per service" reasoning as
  # this being a single container rather than N per-service brokers — unlike
  # MongoDB, an event bus is inherently cross-service infrastructure, not
  # data a single service owns.
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    # -js: enable JetStream. -sd /data: persist JetStream's stream/consumer
    # state to the mounted volume — without an explicit store dir,
    # JetStream defaults to a location that doesn't survive a container
    # recreation, which would silently defeat the whole point of using
    # JetStream (durable consumers resuming after a restart) the moment
    # this container itself restarts, not just the services connecting to
    # it. -m: expose the monitoring/healthz endpoint the healthcheck below uses.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: ["nats-data:/data"]
    ports: ["${NATS_PORT:-4222}:4222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Services
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      USER_SERVICE_PORT: "8081"
      USER_SERVICE_MONGO_URI: mongodb://mongo-user:27017/finora_users
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
    ports: ["8081:8081"]
    depends_on:
      mongo-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  expense-service:
    build:
      context: .
      dockerfile: services/expense-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      EXPENSE_SERVICE_PORT: "8082"
      EXPENSE_SERVICE_MONGO_URI: mongodb://mongo-expense:27017/finora_expenses
      NATS_URL: nats://nats:4222
    ports: ["8082:8082"]
    depends_on:
      mongo-expense:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  budget-service:
    build:
      context: .
      dockerfile: services/budget-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      BUDGET_SERVICE_PORT: "8083"
      BUDGET_SERVICE_MONGO_URI: mongodb://mongo-budget:27017/finora_budgets
      NATS_URL: nats://nats:4222
    ports: ["8083:8083"]
    depends_on:
      mongo-budget:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      NOTIFICATION_SERVICE_PORT: "8084"
      NOTIFICATION_SERVICE_MONGO_URI: mongodb://mongo-notification:27017/finora_notifications
      NATS_URL: nats://nats:4222
    ports: ["8084:8084"]
    depends_on:
      mongo-notification:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      GATEWAY_PORT: "8080"
      USER_SERVICE_URL: http://user-service:8081
      EXPENSE_SERVICE_URL: http://expense-service:8082
      BUDGET_SERVICE_URL: http://budget-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
    ports: ["8080:8080"]
    depends_on:
      user-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  mongo-user-data:
  mongo-expense-data:
  mongo-budget-data:
  mongo-notification-data:
  nats-data:
