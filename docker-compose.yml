name: finora

x-mongo-healthcheck: &mongo-healthcheck
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  interval: 5s
  timeout: 5s
  retries: 10

x-go-service-env: &go-service-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  # ---------------------------------------------------------------- MongoDB
  mongo-user:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-user-data:/data/db"]
    healthcheck: *mongo-healthcheck

  mongo-expense:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-expense-data:/data/db"]
    healthcheck: *mongo-healthcheck

  mongo-budget:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-budget-data:/data/db"]
    healthcheck: *mongo-healthcheck

  mongo-notification:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-notification-data:/data/db"]
    healthcheck: *mongo-healthcheck

  # ---------------------------------------------------------------- Services
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      USER_SERVICE_PORT: "8081"
      USER_SERVICE_MONGO_URI: mongodb://mongo-user:27017/finora_users
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
    ports: ["8081:8081"]
    depends_on:
      mongo-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  expense-service:
    build:
      context: .
      dockerfile: services/expense-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      EXPENSE_SERVICE_PORT: "8082"
      EXPENSE_SERVICE_MONGO_URI: mongodb://mongo-expense:27017/finora_expenses
    ports: ["8082:8082"]
    depends_on:
      mongo-expense:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  budget-service:
    build:
      context: .
      dockerfile: services/budget-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      BUDGET_SERVICE_PORT: "8083"
      BUDGET_SERVICE_MONGO_URI: mongodb://mongo-budget:27017/finora_budgets
    ports: ["8083:8083"]
    depends_on:
      mongo-budget:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      NOTIFICATION_SERVICE_PORT: "8084"
      NOTIFICATION_SERVICE_MONGO_URI: mongodb://mongo-notification:27017/finora_notifications
    ports: ["8084:8084"]
    depends_on:
      mongo-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-service-env
      GATEWAY_PORT: "8080"
      USER_SERVICE_URL: http://user-service:8081
      EXPENSE_SERVICE_URL: http://expense-service:8082
      BUDGET_SERVICE_URL: http://budget-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
    ports: ["8080:8080"]
    depends_on:
      user-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  mongo-user-data:
  mongo-expense-data:
  mongo-budget-data:
  mongo-notification-data:
