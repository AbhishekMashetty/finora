# Unlike expense/budget/notification-service, this one also gets
# finora-secrets: user-service is the only service that issues JWTs
# (signs both the access and refresh token), so it's the only one besides
# the gateway (05-gateway/gateway.yaml) that ever needs JWT_ACCESS_SECRET/
# JWT_REFRESH_SECRET in its environment — least-privilege secret exposure,
# not every Deployment gets every Secret by default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: finora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: user-service
          image: finora/user-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: finora-config
            - secretRef:
                name: finora-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: finora
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
