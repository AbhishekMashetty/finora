# Same shape as expense-service.yaml (see that file for the envFrom/
# security-context/termination-grace rationale) — no JWT secret needed here
# either, same reasoning. Consumes finora.budget.overspent off NATS
# (NATS_URL comes from the shared ConfigMap) — no outbox of its own, it only
# publishes nothing and consumes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: finora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: notification-service
          image: finora/notification-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: finora-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: finora
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
