# Local-only placeholder values, identical to .env.example's own JWT
# defaults — never reuse these outside local dev, and never commit real
# secrets this way in a non-learning context (a real deployment would
# generate these at cluster-provisioning time and inject them via a secrets
# manager — Sealed Secrets, External Secrets Operator, cloud KMS — not check
# them into git; this repo checks them in because they're throwaway local
# dev values, not because that's the right pattern in general).
#
# `stringData` (plaintext here) instead of pre-base64-encoded `data`: the
# API server base64-encodes it on write, so this stays human-readable and
# diffable in git without a manual encode/decode step every time it changes.
apiVersion: v1
kind: Secret
metadata:
  name: finora-secrets
  namespace: finora
type: Opaque
stringData:
  JWT_ACCESS_SECRET: dev-access-secret-change-me
  JWT_REFRESH_SECRET: dev-refresh-secret-change-me
