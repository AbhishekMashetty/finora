# Module 1 version: deliberately no PersistentVolumeClaim yet (that's Module
# 3). Data lives in the container's writable layer and is lost whenever this
# Pod is recreated -- acceptable for now because the point of this file is
# to learn Deployment/ReplicaSet mechanics, not to run durable Mongo yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-user
  namespace: finora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-user
  template:
    metadata:
      labels:
        app: mongo-user
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
